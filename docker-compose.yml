# AI Chat App — Docker Compose for Coolify deployment
#
# Single-container architecture: Express serves both API + static frontend.
#
# How to deploy on Coolify:
#   1. Add a new resource → Application → Docker Compose Build Pack
#   2. Connect your GitHub repository (this repo)
#   3. Coolify will auto-detect docker-compose.yml at the root
#   4. Assign a domain and set JWT_SECRET in Coolify UI
#   5. Deploy!

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Server listens on port 3000 inside the container
      - PORT=3000
      # JWT secret — required for authentication tokens
      - JWT_SECRET=${JWT_SECRET:?Set a JWT_SECRET in Coolify UI}
      # Tell Coolify this service responds on port 3000 (proxy routing)
      - SERVICE_FQDN_APP_3000
    volumes:
      # Persist SQLite database across container rebuilds
      - type: bind
        source: ./data
        target: /app/backend/data
        is_directory: true
